name: Dual Morph Bar Lab

on:
  push:
    branches:
      - experiment/messages-dual-morph-bar
    paths:
      - "experiments/dual-morph-bar/**"
      - "gradle/wrapper/**"
      - "gradlew"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        run: ./gradlew -p experiments/dual-morph-bar :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-morph-bar-debug
          path: experiments/dual-morph-bar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
