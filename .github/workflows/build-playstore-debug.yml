name: Build Playstore Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject secrets.properties
        run: |
          cat << 'EOF' > secrets.properties
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          EOF

      - name: Restore persistent debug keystore
        run: |
          mkdir -p ~/.android
          printf "%s" "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" > b64.txt
          tr -d '[:space:]' < b64.txt > clean.txt
          base64 -d clean.txt > ~/.android/debug.keystore

      - name: Build playstoreDebug APK
        run: ./gradlew assemblePlaystoreDebug

      - name: Print APK package name and SHA-1
        run: |
          APK="app/build/outputs/apk/playstore/debug/app-playstore-debug.apk"
          find "$ANDROID_HOME/build-tools" -name aapt2 > aapt2.txt
          AAPT2=$(tail -n 1 aapt2.txt)
          find "$ANDROID_HOME/build-tools" -name apksigner > apksigner.txt
          APKSIGNER=$(tail -n 1 apksigner.txt)
          echo "### Built APK Metadata" >> "$GITHUB_STEP_SUMMARY"
          "$AAPT2" dump badging "$APK" > badging.txt
          grep -m 1 "^package:" badging.txt >> "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify --print-certs "$APK" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monomail-playstore-debug
          path: app/build/outputs/apk/playstore/debug/app-playstore-debug.apk
          
