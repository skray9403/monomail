name: Build Playstore Debug

on:
  workflow_dispatch:
  push:
    branches:
      - skray9403-patch-1

# Cancel obsolete builds when a newer commit is pushed to the same branch.
# This avoids compiling several stale APKs in parallel during rapid UI iteration.
concurrency:
  group: playstore-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject secrets.properties
        env:
          RAW_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          CLEAN_CLIENT_ID=$(printf '%s' "$RAW_CLIENT_ID" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" -e 's#^https://##' -e 's#^http://##' -e 's#/$##')
          printf 'GOOGLE_CLIENT_ID=%s\n' "$CLEAN_CLIENT_ID" > secrets.properties

      - name: Restore persistent debug keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Run core data regression tests
        run: ./gradlew :core:data:testPlaystoreDebugUnitTest

      - name: Build playstoreDebug APK
        run: ./gradlew assemblePlaystoreDebug

      - name: Print APK package name and SHA-1
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/playstore/debug/app-playstore-debug.apk"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          EXPECTED_CLIENT_ID="193693002878-ajpu4r5m7f5qjr20v9a1g7qi0c58iqod.apps.googleusercontent.com"

          INJECTED_CLIENT_ID=$(grep -E '^GOOGLE_CLIENT_ID=' secrets.properties | cut -d'=' -f2-)
          INJECTED_LEN=${#INJECTED_CLIENT_ID}
          EXPECTED_LEN=${#EXPECTED_CLIENT_ID}
          INJECTED_SHA256=$(printf '%s' "$INJECTED_CLIENT_ID" | sha256sum | awk '{print $1}')
          EXPECTED_SHA256=$(printf '%s' "$EXPECTED_CLIENT_ID" | sha256sum | awk '{print $1}')

          PGP_BC="core/pgp/build/generated/source/buildConfig/playstore/debug/com/shrivatsav/monomail/core/pgp/BuildConfig.java"
          APP_BC="app/build/generated/source/buildConfig/playstore/debug/com/shrivatsav/monomail/BuildConfig.java"

          {
            echo "Built APK metadata"
            echo "Package name:"
            "$AAPT2" dump badging "$APK" | sed -n '1p'
            echo
            echo "Signing certificate:"
            "$APKSIGNER" verify --print-certs "$APK"
            echo
            echo "OAuth Client ID Verification:"
            echo "- Expected Web Client ID: $EXPECTED_CLIENT_ID (len=$EXPECTED_LEN, sha256=$EXPECTED_SHA256)"
            echo "- Injected Web Client ID len: $INJECTED_LEN, sha256: $INJECTED_SHA256"
            if [ "$INJECTED_CLIENT_ID" = "$EXPECTED_CLIENT_ID" ]; then
              echo "- Client ID Match: EXACT MATCH (character-for-character verified)"
            else
              echo "- Client ID Match: MISMATCH!"
              echo "  Injected: '$INJECTED_CLIENT_ID'"
            fi
            echo
            echo "BuildConfig Verification:"
            if [ -f "$PGP_BC" ]; then
              echo "- core:pgp BuildConfig: $(grep 'GOOGLE_CLIENT_ID' "$PGP_BC" | tr -d '\r' | sed -e 's/^[[:space:]]*//')"
            else
              echo "- core:pgp BuildConfig not found at $PGP_BC"
            fi
            if [ -f "$APP_BC" ]; then
              echo "- app BuildConfig: $(grep 'GOOGLE_CLIENT_ID' "$APP_BC" | tr -d '\r' | sed -e 's/^[[:space:]]*//')"
            else
              echo "- app BuildConfig not found at $APP_BC"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: monomail-playstore-debug
          path: app/build/outputs/apk/playstore/debug/app-playstore-debug.apk
