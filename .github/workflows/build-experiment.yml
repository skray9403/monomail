name: Build experiment APK

on:
  push:
    branches:
      - experiment/expressive-clock-dock-effects
    paths:
      - '.github/workflows/build-experiment.yml'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build GitHub debug APK
        run: ./gradlew --no-daemon :app:assembleGithubDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monomail-expressive-dock-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
