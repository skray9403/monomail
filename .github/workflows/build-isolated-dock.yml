name: Build isolated dock experiment

on:
  push:
    branches:
      - experiment/expressive-clock-dock-isolated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated experiment
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build GitHub debug APK
        run: ./gradlew --no-daemon :app:assembleGithubDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monomail-isolated-dock-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
