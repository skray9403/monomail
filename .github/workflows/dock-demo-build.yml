name: Dock demo debug build

on:
  push:
    branches:
      - demo/base-app-improvements-standalone
    paths:
      - "dock-demo/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/dock-demo-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build demo APK
        run: ./gradlew :dock-demo:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mono-mail-dock-demo-debug
          path: dock-demo/build/outputs/apk/debug/dock-demo-debug.apk
          if-no-files-found: error
